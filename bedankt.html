<title>Bedankt — BioGroen Boskoop</title>
<link rel="stylesheet" href="bgb-fonts.css">
<style>

:root{--lime:#A8C63C;--pastel:#D9E4BC;--dark:#3E5C2E;--night:#2B4220;--moss:#4E6E2E;
  --cream:#F3EFE5;--line:#DCD5C2;--f:Nunito,system-ui,-apple-system,'Segoe UI',sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{font-family:var(--f)}
body{margin:0;background:var(--cream);color:var(--night);font-weight:400;font-size:17px;line-height:1.55}
.kop{background:var(--cream);border-bottom:1.5px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.bgb-logo__knock{fill:var(--cream)}
.kop__merk{width:118px;display:block}
.kop__adres{color:var(--moss);text-align:right;margin:0;line-height:1.5;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.vak{background:var(--pastel);padding:44px 18px 40px;text-align:center}
.wrap{max-width:520px;margin:0 auto;padding:0 18px 44px}
h1{font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1.05;letter-spacing:-.015em;margin:18px 0 10px}
h1 em{font-style:italic;color:var(--dark)}
.lead{margin:0 auto;max-width:420px;color:var(--dark)}
.blad{width:76px;height:76px;display:block;margin:0 auto}
.voet{margin-top:30px;text-align:center;font-size:14px;color:var(--moss)}
.voet p{margin:0;line-height:1.65;font-size:13.5px;font-variant-numeric:tabular-nums}
a{color:inherit}
</style>
